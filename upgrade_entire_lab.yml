---
- name: Upgrade Entire Lab Infrastructure
  hosts: all
  become: true

  tasks:
    - name: Run apt upgrade on host machines
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot the server if required
      ansible.builtin.reboot:
        msg: "Rebooting machine to apply updates"
      when: reboot_required_file.stat.exists

    - name: Ensure key services are running post-reboot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Verify monitoring stack is up
      ansible.builtin.systemd:
        name: prometheus
        state: started
        enabled: true

    - name: Ensure the Wazuh Docker stack boots cleanly back up
      ansible.builtin.shell: docker compose -f /opt/wazuh/docker-compose.yml up -d
      args:
        chdir: /opt/wazuh
      register: docker_compose_output
      changed_when: "'Creating' in docker_compose_output.stdout or 'Starting' in docker_compose_output.stdout or 'Running' in docker_compose_output.stdout"